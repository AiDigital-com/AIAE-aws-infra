{{- if .Values.argocd.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.argocd.projectName }}-target-cluster
  namespace: {{ .Values.argocd.namespace }}
  labels:
    argocd.argoproj.io/secret-type: cluster
stringData:
  name: {{ .Values.argocd.projectName }}
  server: {{ .Values.argocd.clusterArn }}
  project: {{ .Values.argocd.projectName }}
{{- if .Values.argocd.gitopsBootstrapEnabled }}
---
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: {{ .Values.argocd.projectName }}
  namespace: {{ .Values.argocd.namespace }}
spec:
  sourceNamespaces:
    - {{ .Values.argocd.namespace }}
  destinations:
    - namespace: {{ .Values.argocd.targetNamespace }}
      server: {{ .Values.argocd.clusterArn }}
    - namespace: {{ .Values.argocd.namespace }}
      server: {{ .Values.argocd.clusterArn }}
  sourceRepos:
    - {{ .Values.argocd.helmRepositoryUrl | quote }}
    - {{ .Values.argocd.versionsRepositoryUrl | quote }}
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
  namespaceResourceWhitelist:
    - group: "*"
      kind: "*"
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: {{ .Values.argocd.projectName }}-root
  namespace: {{ .Values.argocd.namespace }}
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: {{ .Values.argocd.projectName }}
  destination:
    server: {{ .Values.argocd.clusterArn }}
    namespace: {{ .Values.argocd.namespace }}
  source:
    repoURL: {{ .Values.argocd.helmRepositoryUrl | quote }}
    targetRevision: {{ .Values.argocd.targetRevision }}
    path: aiae
    helm:
      parameters:
        - name: destination.server
          value: {{ .Values.argocd.clusterArn | quote }}
        - name: source.helmRepositoryUrl
          value: {{ .Values.argocd.helmRepositoryUrl | quote }}
        - name: source.versionsRepositoryUrl
          value: {{ .Values.argocd.versionsRepositoryUrl | quote }}
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
{{- end }}
{{- end }}
